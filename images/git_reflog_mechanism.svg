<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="100%">
  <!-- Background -->
  <rect width="940" height="480" fill="rgb(15, 23, 42)" rx="10" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Top bar -->
  <rect width="940" height="42" fill="rgb(30, 41, 59)" rx="10"/>
  <rect y="32" width="940" height="10" fill="rgb(30, 41, 59)"/>
  <circle cx="22" cy="21" r="6" fill="#ef4444"/>
  <circle cx="40" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="58" cy="21" r="6" fill="#22c55e"/>
  <text x="310" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">
    Co Che Hoat Dong Cua Git Reflog &amp; Dangling Commit
  </text>

  <!-- Left: Commit a1b2c3d -->
  <g transform="translate(60, 180)">
    <circle cx="50" cy="50" r="38" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="50" y="47" text-anchor="middle" fill="#38bdf8" font-family="'Consolas', monospace" font-size="14" font-weight="700">a1b2c3d</text>
    <text x="50" y="65" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Base Commit</text>

    <!-- HEAD marker when reset -->
    <rect x="-10" y="105" width="120" height="26" rx="6" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1"/>
    <text x="50" y="122" text-anchor="middle" fill="#fca5a5" font-family="'Consolas', monospace" font-size="11">HEAD (sau reset)</text>
  </g>

  <!-- Arrow between commits -->
  <path d="M165 230 L320 230" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="320,225 332,230 320,235" fill="#38bdf8"/>

  <!-- Right: Commit e3a5b2c (Orphaned / Dangling Commit) -->
  <g transform="translate(340, 180)">
    <circle cx="50" cy="50" r="38" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4"/>
    <text x="50" y="47" text-anchor="middle" fill="#f87171" font-family="'Consolas', monospace" font-size="14" font-weight="700">e3a5b2c</text>
    <text x="50" y="65" text-anchor="middle" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="10">Them tinh nang</text>

    <rect x="-10" y="105" width="120" height="26" rx="6" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1"/>
    <text x="50" y="122" text-anchor="middle" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="11">Dangling Commit</text>
    <text x="50" y="146" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">git log khong thay</text>
  </g>

  <!-- Reflog Safety Net (Bottom Box) -->
  <g transform="translate(540, 100)">
    <rect width="360" height="290" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="#22c55e" stroke-width="1.5"/>
    <rect width="360" height="38" rx="10" fill="rgba(34, 197, 94, 0.2)"/>
    <text x="180" y="25" text-anchor="middle" fill="#22c55e" font-family="'Inter', sans-serif" font-size="13" font-weight="700">
      HOP DEN REFLOG (Ghi nhan moi thao tac)
    </text>

    <!-- Reflog Entries -->
    <g transform="translate(20, 55)">
      <rect width="320" height="50" rx="6" fill="rgba(15, 23, 42, 0.7)"/>
      <text x="15" y="24" fill="#f59e0b" font-family="'Consolas', monospace" font-size="12">HEAD@{0}: reset --hard</text>
      <text x="15" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Lui con tro ve HEAD~1</text>
    </g>

    <g transform="translate(20, 115)">
      <rect width="320" height="60" rx="6" fill="rgba(34, 197, 94, 0.15)" stroke="#22c55e" stroke-width="1"/>
      <text x="15" y="24" fill="#22c55e" font-family="'Consolas', monospace" font-size="12" font-weight="700">HEAD@{1}: commit: Them tinh nang</text>
      <text x="15" y="42" fill="#38bdf8" font-family="'Consolas', monospace" font-size="12">Ma hash: e3a5b2c</text>
      <text x="210" y="42" fill="#22c55e" font-family="'Inter', sans-serif" font-size="11" font-weight="bold">KHOI PHUC DUOC</text>
    </g>

    <g transform="translate(20, 185)">
      <rect width="320" height="50" rx="6" fill="rgba(15, 23, 42, 0.7)"/>
      <text x="15" y="24" fill="#94a3b8" font-family="'Consolas', monospace" font-size="12">HEAD@{2}: commit: Khoi tao</text>
      <text x="15" y="42" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Commit goc ban dau</text>
    </g>

    <!-- Recovery command -->
    <g transform="translate(20, 245)">
      <text x="160" y="22" text-anchor="middle" fill="#38bdf8" font-family="'Consolas', monospace" font-size="12" font-weight="bold">
        git reset --hard e3a5b2c
      </text>
    </g>
  </g>

  <!-- Curve line from Reflog to Dangling Commit -->
  <path d="M540 230 C480 230, 480 230, 440 230" stroke="#22c55e" stroke-width="3" stroke-dasharray="4,4"/>
</svg>
